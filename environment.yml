name: fusion-hx-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.13
  - sphinx-tags
  - matplotlib
  - ipywidgets
  - meshio[all]
  - pip>=20.1
  - ipykernel
  - nbconvert
  - fenics-dolfinx
  - festim=2.0b1
  - python-gmsh
  - pip:
    - pyparsing
    - h-transport-materials==0.16
    - pyvista[all,trame]  # trame cannot be installed on conda
    - git+https://github.com/festim-dev/foam2dolfinx